name: Update WA security officers CSV

on:
  workflow_dispatch:
  schedule:
    # 06:15 every morning in Perth
    - cron: "15 22 * * *"

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF reader
        run: python -m pip install -r requirements.txt

      - name: Download PDF and build CSV
        run: python update_csv.py

      - name: Commit changed CSV
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/wa_security_officers.csv)" ]; then
            echo "The register has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wa_security_officers.csv
          git commit -m "Update WA security officers CSV"
          git push
